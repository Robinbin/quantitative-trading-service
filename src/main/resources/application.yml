spring:
  application:
    name: quantitative-trading-service
  cache:
    type: caffeine
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

trading:
  market-data:
    watch-list:
      - AAPL
      - TSLA
      - MSFT
    tick-refresh-seconds: 30
    ohlcv-refresh-minutes: 5

logging:
  level:
    com.trading: DEBUG
    org.springframework.ai: INFO
