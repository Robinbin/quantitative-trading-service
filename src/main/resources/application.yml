spring:
  application:
    name: quantitative-trading-service
  cache:
    type: caffeine
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

trading:
  market-data:
    watch-list:
      - AAPL
      - TSLA
      - MSFT
    tick-refresh-seconds: 30
    ohlcv-refresh-minutes: 5
  risk:
    stop-loss-pct: 0.05
    take-profit-pct: 0.15
    risk-free-rate: 0.05
    volatility-thresholds:
      low: 0.20
      medium: 0.40
      high: 0.60
  executor:
    initial-cash: 100000.0
    max-order-value: 10000.0
    min-strategies-agree: 3
    min-confidence: 0.60

logging:
  level:
    com.trading: DEBUG
    org.springframework.ai: INFO
